<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#050508" rx="100"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1F2438" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Crosshairs / Quadrant axes -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="96" y1="256" x2="416" y2="256" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Quadrant I (Top Left: Memory / Past - Gold) -->
  <circle cx="176" cy="176" r="24" fill="#D4AF37" fill-opacity="0.2" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="176" cy="176" r="8" fill="#D4AF37"/>

  <!-- Quadrant II (Top Right: Meaning / Affect - Crimson) -->
  <circle cx="336" cy="176" r="24" fill="#F43F5E" fill-opacity="0.2" stroke="#F43F5E" stroke-width="2.5"/>
  <circle cx="336" cy="176" r="8" fill="#F43F5E"/>

  <!-- Quadrant III (Bottom Left: Present / Embodiment - Emerald) -->
  <circle cx="176" cy="336" r="24" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2.5"/>
  <circle cx="176" cy="336" r="8" fill="#10B981"/>

  <!-- Quadrant IV (Bottom Right: Future / Projection - Violet) -->
  <circle cx="336" cy="336" r="24" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="2.5"/>
  <circle cx="336" cy="336" r="8" fill="#8B5CF6"/>

  <!-- Center META Observation Sphere (White / Cyan / Gold) -->
  <circle cx="256" cy="256" r="44" fill="#0A0D18" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="256" cy="256" r="32" fill="#D4AF37" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="256" cy="256" r="14" fill="#FFFFFF"/>
</svg>
